<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1e1e1e; color: #eee; }
    #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; }
    input { padding: 8px 12px; width: 260px; border-radius: 4px; border: 1px solid #555; background: #2d2d2d; color: #fff; }
    button { padding: 8px 16px; border-radius: 4px; border: none; background: #0078d4; color: white; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: none; display: none; background: white; }
  </style>
</head>
<body>
  <div id="setup">
    <div>Enter local filename (e.g. <code>phonon_focusing.html</code>) or drop HTML file here:</div>
    <div>
      <input id="urlInput" type="text" placeholder="my_visual.html" />
      <button onclick="loadUrl(document.getElementById('urlInput').value)">Embed</button>
    </div>
  </div>
  <iframe id="frame"></iframe>

  <script>
    const frame = document.getElementById('frame');
    const setup = document.getElementById('setup');

    function showContent(src, isRawHtml = false) {
      setup.style.display = 'none';
      frame.style.display = 'block';
      if (isRawHtml) frame.srcdoc = src;
      else frame.src = src;
    }

    function loadUrl(val) {
      if (!val) return;
      if (Office.context && Office.context.document) {
        Office.context.document.settings.set('savedSrc', val);
        Office.context.document.settings.saveAsync();
      }
      showContent(val, false);
    }

    // Also allow dragging and dropping any self-contained .html file from Explorer!
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          const html = ev.target.result;
          if (Office.context && Office.context.document) {
            Office.context.document.settings.set('savedHtml', html);
            Office.context.document.settings.saveAsync();
          }
          showContent(html, true);
        };
        reader.readAsText(file);
      }
    });

    Office.onReady(() => {
      if (Office.context && Office.context.document) {
        const savedHtml = Office.context.document.settings.get('savedHtml');
        const savedSrc = Office.context.document.settings.get('savedSrc');
        if (savedHtml) showContent(savedHtml, true);
        else if (savedSrc) showContent(savedSrc, false);
      }
    });
  </script>
</body>
</html>
